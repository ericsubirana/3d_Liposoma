<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIP-OFF — Nanomedicina per l'Alzheimer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #e2e8f0; -webkit-font-smoothing: antialiased; }
      @keyframes scrollDot {
        0%   { transform: translateY(0);   opacity: 1; }
        70%  { transform: translateY(14px); opacity: 0; }
        71%  { transform: translateY(0);   opacity: 0; }
        100% { transform: translateY(0);   opacity: 1; }
      }
      @keyframes fadePulse {
        0%, 100% { opacity: 0.7; }
        50%       { opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
